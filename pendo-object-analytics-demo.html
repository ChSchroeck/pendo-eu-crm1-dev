<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendo Object Analytics — Ticket Demo</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.subtitle { color: #666; font-size: 0.9rem; margin-top: 0; }

    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 1rem;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      padding: 9px 16px;
      font-size: 0.95rem;
      border: 1px solid #999;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
    }
    button:hover { background: #e8e8e8; }

    #log {
      margin-top: 24px;
      border-top: 1px solid #ddd;
      padding-top: 12px;
      font-size: 0.85rem;
      color: #444;
    }
    #log p { margin: 4px 0; }
    .ok  { color: #1a7a1a; }
    .err { color: #b00; }

    #url-indicator {
      margin-top: 20px;
      padding: 8px 12px;
      background: #f0f4ff;
      border: 1px solid #c0ccee;
      border-radius: 4px;
      font-size: 0.82rem;
      color: #333;
      word-break: break-all;
    }
    #url-indicator strong { color: #555; }
  </style>
</head>
<body>

<h1>Pendo Object Analytics — Ticket Demo</h1>
<p class="subtitle">Sends Track Events with a <code>ticketId</code> property for object tracking.</p>

<label for="ticketInput">Ticket Number</label>
<input id="ticketInput" type="text" placeholder="e.g. TICKET-1234">

<div class="buttons">
  <button onclick="send('Ticket Created')">Create Ticket</button>
  <button onclick="send('Ticket Assigned')">Assign Ticket</button>
  <button onclick="send('Ticket Paused')">Pause Ticket</button>
  <button onclick="send('Ticket Resolved')">Resolve Ticket</button>
  <button onclick="send('Ticket Closed')">Close Ticket</button>
</div>

<div id="url-indicator"><strong>Pendo URL:</strong> <span id="pendo-url">—</span></div>

<div id="log"></div>

<script>
  // ─── Configuration ───────────────────────────────────────────────────────────
  const PENDO_API_KEY  = '7d66e821-ff08-4795-a340-1a3ebbd3df49';
  const VISITOR_ID     = 'user_001';    // ← replace with real visitor ID
  const ACCOUNT_ID     = 'account_001'; // ← replace with real account ID
  // ─────────────────────────────────────────────────────────────────────────────

  // Pendo snippet (EU CDN)
  (function(apiKey){
    (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
    v=['initialize','identify','updateOptions','pageLoad','track'];for(w=0,x=v.length;w<x;++w)(function(m){
    o[m]=o[m]||function(){o._q[m===v[0]?'unshift':'push']([m].concat([].slice.call(arguments,0)));};})(v[w]);
    y=e.createElement(n);y.async=!0;y.src='https://cdn.eu.pendo.io/agent/static/'+apiKey+'/pendo.js';
    z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');

    pendo.initialize({
      visitor: { id: VISITOR_ID },
      account: { id: ACCOUNT_ID },

      // Location API: dynamically report a /tickets/{ticketId} URL to Pendo
      // so the ticket ID is captured on page events without needing it in the
      // real browser URL. In the Object Analytics setup, use the URL rule:
      //   //*/tickets/*value*
      location: {
        setUrl: function () {
          const ticketId = document.getElementById('ticketInput')?.value.trim();
          if (ticketId) {
            return window.location.origin + '/tickets/' + encodeURIComponent(ticketId);
          }
          return window.location.href; // fall back to real URL when no ticket
        }
      }
    });
  })(PENDO_API_KEY);

  // ─── Keep the URL indicator in sync ──────────────────────────────────────────
  function refreshUrlIndicator() {
    const el = document.getElementById('pendo-url');
    if (el && window.pendo && pendo.location) {
      el.textContent = pendo.location.getHref() || '—';
    }
  }

  // Poll every 600 ms — matches Pendo's own setUrl polling interval
  setInterval(refreshUrlIndicator, 600);
  // Also refresh immediately when the ticket field changes
  document.getElementById('ticketInput').addEventListener('input', () => {
    setTimeout(refreshUrlIndicator, 50); // slight delay so Pendo picks up the change first
  });

  // ─── Logging helper ──────────────────────────────────────────────────────────
  function log(msg, isError) {
    const div = document.getElementById('log');
    const p   = document.createElement('p');
    p.className  = isError ? 'err' : 'ok';
    p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    div.prepend(p);
  }

  // ─── Send track event via Pendo JS SDK ───────────────────────────────────────
  function send(eventName) {
    const ticketId = document.getElementById('ticketInput').value.trim();
    if (!ticketId) {
      log('Enter a ticket number first.', true);
      return;
    }

    try {
      pendo.track(eventName, { ticketId: ticketId });
      log(`✓ "${eventName}" sent for ticket ${ticketId}`);
    } catch (err) {
      log(`✗ ${err.message}`, true);
    }
  }
</script>

</body>
</html>
